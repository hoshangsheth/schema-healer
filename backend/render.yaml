services:
  - type: web
    name: schema-healer-backend
    runtime: python
    plan: free

    buildCommand: pip install -r backend/requirements.txt

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    autoDeploy: true

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: LLM_MODEL_NAME
        value: gemini-3.6-flash

      - key: LLM_REQUEST_TIMEOUT
        value: "30"